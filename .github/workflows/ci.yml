name: ThingsBoard Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 允许 GITHUB_TOKEN 推送 gh-pages 分支（发布 Allure 报告）
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    # 用服务容器拉起 ThingsBoard（和本地 docker-compose.yml 同一个镜像、同一个配置）
    # ⚠️ 必须锁版本：latest(4.x) 已把 /api/auth/login 改成 OAuth2 登录，返回 HTML 而非 JSON，导致登录/接口/UI 用例全部挂掉
    services:
      thingsboard:
        image: thingsboard/tb-postgres:3.9.1
        ports:
          - 8080:9090            # 网页接口：宿主8080 → 容器9090
          - 1883:1883            # MQTT 端口：设备模拟器上报走这里
        env:
          TB_QUEUE_TYPE: in-memory

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Wait for ThingsBoard to be ready
        run: |
          # 轮询登录接口直到真正返回 JSON token：既等数据库迁移完成，也提前验证登录可用
          for i in {1..90}; do
            if curl -s -X POST http://localhost:8080/api/auth/login \
                 -H "Content-Type: application/json" \
                 -d '{"username":"tenant@thingsboard.org","password":"tenant"}' | grep -q '"token"'; then
              echo "ThingsBoard is up and login API works"; exit 0
            fi
            sleep 5
          done
          echo "ThingsBoard failed to become ready"; exit 1

      - name: Run all tests
        run: python -m pytest -v --alluredir=allure-results

      # 用例挂了也照样出报告（if: always()），否则看不到是哪条失败
      # 1) 拉取历史报告（首次 gh-pages 分支不存在，用 continue-on-error 容错）
      - name: Load report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 2) 生成 Allure 报告（含历史）
      - name: Build Allure report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: allure-results
          allure_history: allure-history

      # 3) 清理 simple-elf 动作残留的 .git（root 权限创建，peaceiris 删不掉会报 EACCES）
      - name: Clean stray .git in allure-history
        if: always()
        run: sudo rm -rf allure-history/.git || true

      # 4) 把 allure-history 推送到 gh-pages 分支，供 GitHub Pages 展示
      #    force_orphan 修复首次部署时 commit 落到 master、导致 push gh-pages 报 "src refspec does not match"
      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true
