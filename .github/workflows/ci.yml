name: ThingsBoard Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 用服务容器拉起 ThingsBoard（和本地 docker-compose.yml 同一个镜像、同一个配置）
    services:
      thingsboard:
        image: thingsboard/tb-postgres
        ports:
          - 8080:9090            # 网页接口：宿主8080 → 容器9090
        env:
          TB_QUEUE_TYPE: in-memory

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Wait for ThingsBoard to be ready
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login)
            if [ "$code" = "200" ]; then
              echo "ThingsBoard is up"; exit 0
            fi
            sleep 5
          done
          echo "ThingsBoard failed to start"; exit 1

      - name: Run all tests
        run: python -m pytest -v --alluredir=allure-results

      # 用例挂了也照样出报告（if: always()），否则看不到是哪条失败
      - name: Publish Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
